<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スタック司令室</title>
<meta name="theme-color" content="#02040b">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="司令室">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  /* =========================================================
     スタック司令室  ver 1.0
     背景(canvas)は飾り。意味があるのは中央の天気と、隅のスタックの通信だけ。
     ========================================================= */
  :root {
    --void: #02040b;
    --navy: #06122a;
    --glow: #3d8bff;
    --glow2: #7fb6ff;
    --ice: #cfe3ff;
    --dim: #6f8fbf;
    --warn: #ffcf7a;
    --panel: rgba(8, 22, 52, .55);
    --line: rgba(120, 175, 255, .28);
    --mono: "Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--void); color: var(--ice); font-family: var(--jp);
    overflow: hidden; -webkit-tap-highlight-color: transparent;
  }
  canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .app {
    position: fixed; inset: 0;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
  }
  .topbar {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--dim);
  }
  .topbar .tag { color: var(--ice); white-space: nowrap; }
  .topbar .tag b { color: var(--glow); font-weight: 400; }
  .clock { text-align: right; font-variant-numeric: tabular-nums; }
  .clock .t { color: var(--ice); font-size: 15px; }

  /* ---------- center: weather ---------- */
  .center { display: flex; align-items: center; justify-content: center; min-height: 0; overflow-y: auto; }
  .panel {
    width: min(560px, 100%);
    background: linear-gradient(180deg, rgba(8, 24, 58, .86), rgba(3, 10, 28, .88));
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(61,139,255,.06), 0 0 40px rgba(40,110,255,.18) inset;
    padding: 16px 18px 14px; position: relative;
  }
  .panel::before, .panel::after {   /* 角の光るカギ */
    content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--glow2);
  }
  .panel::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .panel::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .ph {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--dim);
    border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 12px;
  }
  .ph .place { font-family: var(--jp); letter-spacing: .06em; color: var(--ice); font-size: 13px; }
  .live { color: var(--glow2); }
  .live::before { content: "●"; margin-right: 6px; animation: blink 1.6s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  .today { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
  .wicon { width: 76px; height: 76px; filter: drop-shadow(0 0 8px rgba(80,150,255,.7)); }
  .wday { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--dim); }
  .wtext { font-size: 20px; font-weight: 700; line-height: 1.35; margin: 2px 0 6px; text-shadow: 0 0 12px rgba(80,150,255,.55); }
  .temps { display: flex; gap: 18px; font-family: var(--mono); align-items: baseline; flex-wrap: wrap; }
  .temps .lbl { font-family: var(--jp); font-size: 11px; color: var(--dim); margin-right: 6px; }
  .temps .hi { font-size: 26px; color: #ffd9a8; text-shadow: 0 0 10px rgba(255,170,90,.45); }
  .temps .lo { font-size: 26px; color: #a8d4ff; text-shadow: 0 0 10px rgba(90,170,255,.55); }
  .temps small { font-size: 13px; margin-left: 2px; color: var(--dim); }

  .pops { margin-top: 14px; }
  .pops .cap { font-size: 11px; color: var(--dim); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .bar { border: 1px solid var(--line); border-radius: 3px; padding: 6px 4px 5px; text-align: center; position: relative; overflow: hidden; }
  .bar .fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, rgba(61,139,255,.55), rgba(61,139,255,.08)); }
  .bar .v { position: relative; font-family: var(--mono); font-size: 16px; }
  .bar .h { position: relative; font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .bar.na .v { color: var(--dim); }

  .tomorrow {
    margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line);
    display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center; font-size: 13px;
  }
  .tomorrow .wicon { width: 34px; height: 34px; }
  .tomorrow .tt { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  .tomorrow .tt .hi2 { color: #ffd9a8; } .tomorrow .tt .lo2 { color: #a8d4ff; }
  .src { margin-top: 10px; font-size: 10px; color: var(--dim); line-height: 1.6; }
  .err { color: var(--warn); font-size: 13px; line-height: 1.7; }
  .err button { margin-top: 8px; }

  /* ---------- bottom: stack + 通信 ---------- */
  .comms { display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; }
  .bubble {
    max-width: 440px; flex: 1 1 auto;
    background: rgba(4, 14, 36, .78); border: 1px solid var(--line); border-radius: 6px 6px 0 6px;
    padding: 8px 12px 10px; font-size: 14px; line-height: 1.65; min-height: 3.2em;
  }
  .bubble .who { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--glow2); margin-bottom: 2px; }
  .bubble .msg::after { content: "▍"; color: var(--glow2); animation: blink 1s steps(2) infinite; }
  .bubble .msg.done::after { content: ""; }
  .stack { width: 86px; flex: 0 0 auto; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; }
  .stack svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 10px rgba(61,139,255,.55)); }
  .stack:focus-visible { outline: 1px dashed var(--glow2); outline-offset: 4px; }
  .stack .cap { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; color: var(--dim); text-align: center; margin-top: 2px; }

  button.btn {
    font-family: var(--jp); font-size: 14px; color: var(--ice); cursor: pointer;
    background: rgba(61,139,255,.18); border: 1px solid var(--glow); border-radius: 4px; padding: 8px 16px;
  }
  button.btn:active { background: rgba(61,139,255,.35); }

  /* ---------- 合言葉ゲート ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(6,18,42,.55), rgba(2,4,11,.92));
    padding: 16px;
  }
  .gate[hidden] { display: none; }
  .app.locked { visibility: hidden; }
  .gate .box { width: min(360px, 100%); text-align: center; }
  .gate .k { font-family: var(--mono); letter-spacing: .3em; font-size: 12px; color: var(--glow2); margin-bottom: 14px; }
  .gate h1 { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
  .gate p { font-size: 12px; color: var(--dim); line-height: 1.7; margin-bottom: 14px; }
  .gate input {
    width: 100%; font-size: 18px; text-align: center; letter-spacing: .1em;
    background: rgba(2,8,22,.8); color: var(--ice); border: 1px solid var(--glow); border-radius: 4px;
    padding: 10px; margin-bottom: 10px; outline: none; font-family: var(--jp);
  }
  .gate input:focus { box-shadow: 0 0 0 3px rgba(61,139,255,.3); }
  .gate .note { min-height: 1.5em; font-size: 13px; color: var(--warn); margin-top: 8px; }
  .gate .code {
    font-family: var(--mono); font-size: 15px; letter-spacing: .08em; word-break: break-all; user-select: all;
    background: rgba(2,8,22,.8); border: 1px dashed var(--glow2); padding: 10px; border-radius: 4px; margin: 8px 0 12px;
  }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  /* ---------- 小さい画面 ---------- */
  @media (max-width: 520px) {
    .topbar { font-size: 10px; letter-spacing: .1em; }
    .topbar .tag .long { display: none; }
    .panel { padding: 14px 14px 12px; }
    .wicon { width: 60px; height: 60px; }
    .wtext { font-size: 17px; }
    .temps .hi, .temps .lo { font-size: 22px; }
    .bubble { font-size: 13px; }
    .stack { width: 70px; }
    .tomorrow { grid-template-columns: auto 1fr auto; row-gap: 4px; }
    .tomorrow .wday { grid-column: 1 / 4; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live::before, .bubble .msg::after { animation: none; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="app locked" id="app" aria-hidden="true">
  <header class="topbar">
    <span class="tag"><b>■</b> STACK<span class="long"> // COMMAND ROOM</span></span>
    <div class="clock"><div class="t" id="clock">--:--:--</div><div id="date">----</div></div>
  </header>

  <main class="center">
    <section class="panel" aria-label="上田市の天気">
      <div class="ph"><span class="place">上田市の天気</span><span class="live" id="live">RECEIVING</span></div>
      <div id="wx"><div class="err" style="color:var(--dim)">気象庁のデータを受信中…</div></div>
    </section>
  </main>

  <footer class="comms">
    <div class="bubble" aria-live="polite">
      <div class="who">TRANSMISSION ▸ STACK</div>
      <div class="msg" id="msg"></div>
    </div>
    <button class="stack" id="stackBtn" type="button" aria-label="スタック（押すともう一度話すよ）">
      <svg viewBox="0 0 100 110" aria-hidden="true">
        <defs>
          <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1b2f5c"/><stop offset="1" stop-color="#0a1530"/>
          </linearGradient>
        </defs>
        <!-- からだ（座った姿） -->
        <rect x="26" y="78" width="48" height="24" rx="8" fill="url(#shell)" stroke="#5c9bff" stroke-width="1.5"/>
        <rect x="18" y="96" width="22" height="9" rx="4" fill="#0e1c3e" stroke="#5c9bff" stroke-width="1.2"/>
        <rect x="60" y="96" width="22" height="9" rx="4" fill="#0e1c3e" stroke="#5c9bff" stroke-width="1.2"/>
        <circle cx="50" cy="90" r="3" fill="#7fb6ff"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
        <!-- あたま -->
        <rect x="8" y="10" width="84" height="68" rx="14" fill="url(#shell)" stroke="#7fb6ff" stroke-width="2"/>
        <!-- インカム -->
        <path d="M8 40 h-4 v16 h4" fill="none" stroke="#7fb6ff" stroke-width="2"/>
        <path d="M4 54 q0 14 18 16" fill="none" stroke="#7fb6ff" stroke-width="1.5"/>
        <circle cx="23" cy="70" r="2.2" fill="#7fb6ff"/>
        <!-- 画面 -->
        <rect x="16" y="18" width="68" height="52" rx="8" fill="#030914"/>
        <g id="eyes" fill="#d6e8ff">
          <rect x="30" y="34" width="9" height="12" rx="4.5"/>
          <rect x="61" y="34" width="9" height="12" rx="4.5"/>
        </g>
        <ellipse id="mouth" cx="50" cy="56" rx="8" ry="1.2" fill="#d6e8ff"/>
      </svg>
      <div class="cap">STACK</div>
    </button>
  </footer>
</div>

<div class="gate" id="gate">
  <div class="box" id="gateBox"></div>
</div>

<script>
/* ===== 合言葉の登録コード =====
   ここが空のあいだは「合言葉を決める」画面になります。
   決めると出てくる登録コードを、下の "" の中に入れると完成。 */
const PASS_CODE = "dcbbd13c783a25d504eed386ea8c7e7d";
const SALT = "stack-shireishitsu-v1";

/* ===== 天気の設定（stack_tools.py と同じ） ===== */
const JMA_URL = "https://www.jma.go.jp/bosai/forecast/data/forecast/200000.json"; // 長野県
const AREA = "200020";     // 長野県 中部（上田市を含む）
const WEEK_AREA = "200100";// 週間予報 中部・南部
const TEMP = "48156";      // 気温の地点：長野
const TEMP_NAME = "長野市";
const REFRESH_MIN = 30;

(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  /* ---------------- 合言葉 ---------------- */
  async function hashPass(p) {
    const norm = p.normalize("NFKC").trim().replace(/\s+/g, "");
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey("raw", enc.encode(norm), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(SALT), iterations: 150000, hash: "SHA-256" }, key, 128);
    return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  const gate = $("gate"), box = $("gateBox"), app = $("app");

  function openApp() {
    gate.hidden = true; app.classList.remove("locked"); app.removeAttribute("aria-hidden");
    startMain();
  }

  function showLogin() {
    box.innerHTML = `
      <div class="k">ACCESS CHECK</div>
      <h1>合言葉をどうぞ</h1>
      <p>司令室に入るための合言葉よ。</p>
      <form id="f"><input id="pw" type="password" autocomplete="current-password" aria-label="合言葉">
      <button class="btn" type="submit">解除する</button></form>
      <div class="note" id="note"></div>`;
    const pw = $("pw"); pw.focus();
    $("f").onsubmit = async (e) => {
      e.preventDefault();
      if (!pw.value.trim()) return;
      if ((await hashPass(pw.value)) === PASS_CODE) {
        store.set("stackPass", PASS_CODE); openApp();
      } else {
        $("note").textContent = "それはぼくのデータにないよ。もう一回ね。";
        box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
        pw.select();
      }
    };
  }

  function showSetup() {
    box.innerHTML = `
      <div class="k">FIRST SETUP</div>
      <h1>合言葉を決めてね</h1>
      <p>マヌケで簡単なものでOK。<br>チャットには書かないでね。</p>
      <form id="f">
        <input id="p1" type="password" autocomplete="new-password" placeholder="合言葉" aria-label="合言葉">
        <input id="p2" type="password" autocomplete="new-password" placeholder="もう一回" aria-label="合言葉をもう一回">
        <button class="btn" type="submit">決定</button></form>
      <div class="note" id="note"></div>`;
    $("p1").focus();
    $("f").onsubmit = async (e) => {
      e.preventDefault();
      const a = $("p1").value, b = $("p2").value;
      if (!a.trim()) { $("note").textContent = "合言葉が空っぽよ。"; return; }
      if (a !== b) { $("note").textContent = "2つがちがうみたい。もう一回ね。"; return; }
      const code = await hashPass(a);
      box.innerHTML = `
        <div class="k">REGISTERED</div>
        <h1>登録コードができたよ</h1>
        <p>下のコードをClaudeに送ってね。<br>これは合言葉そのものではないから、送って大丈夫よ。</p>
        <div class="code" id="code">${code}</div>
        <button class="btn" id="cp" type="button">コピーする</button>
        <div class="note" id="note"></div>
        <p style="margin-top:14px"><a href="#" id="go" style="color:var(--glow2)">とりあえず中を見る</a></p>`;
      $("cp").onclick = async () => {
        try { await navigator.clipboard.writeText(code); $("note").textContent = "コピーしたよ！"; }
        catch { $("note").textContent = "コードを長押しして選んでね。"; }
      };
      $("go").onclick = (ev) => { ev.preventDefault(); openApp(); };
    };
  }

  if (!PASS_CODE) showSetup();
  else if (store.get("stackPass") === PASS_CODE) openApp();
  else showLogin();

  /* ---------------- 時計 ---------------- */
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  function jstNow() { return new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 60000); }
  function tick() {
    const n = jstNow(), p = (x) => String(x).padStart(2, "0");
    $("clock").textContent = `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
    $("date").textContent = `${n.getFullYear()}.${p(n.getMonth() + 1)}.${p(n.getDate())} ${WD[n.getDay()]}`;
  }
  tick(); setInterval(tick, 1000);

  /* ---------------- スタックの口と声 ---------------- */
  const mouth = $("mouth"), msgEl = $("msg");
  let talkTimer = null, lastLine = "";
  function setMouth(open) { mouth.setAttribute("ry", open ? (3 + Math.random() * 4).toFixed(1) : "1.2"); }
  function say(text) {
    lastLine = text;
    clearInterval(talkTimer);
    msgEl.classList.remove("done"); msgEl.textContent = "";
    let i = 0;
    talkTimer = setInterval(() => {
      i++;
      msgEl.textContent = text.slice(0, i);
      const ch = text[i - 1];
      setMouth(!/[、。！？…\s]/.test(ch) && i % 2 === 0);
      if (i >= text.length) { clearInterval(talkTimer); setMouth(false); msgEl.classList.add("done"); }
    }, 70);
  }
  function speakAloud(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…+/g, "、"));
    u.lang = "ja-JP"; u.rate = 1.05; u.pitch = 1.35;
    const v = speechSynthesis.getVoices().find((x) => x.lang && x.lang.startsWith("ja"));
    if (v) u.voice = v;
    let flap = null;
    u.onstart = () => { flap = setInterval(() => setMouth(Math.random() > .35), 110); };
    u.onend = u.onerror = () => { clearInterval(flap); setMouth(false); };
    speechSynthesis.speak(u);
  }
  $("stackBtn").onclick = () => { if (lastLine) { say(lastLine); speakAloud(lastLine); } };

  // まばたき
  const eyes = $("eyes");
  setInterval(() => {
    eyes.setAttribute("transform", "translate(0 40) scale(1 .1) translate(0 -40)");
    setTimeout(() => eyes.removeAttribute("transform"), 140);
  }, 4200);

  /* ---------------- 天気 ---------------- */
  const dkey = (d) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  const parse = (t) => { const d = new Date(t); return new Date(d.getTime() + (d.getTimezoneOffset() + 540) * 60000); }; // JSTの壁時計
  const find = (s, code) => (s && s.areas || []).find((a) => a.area.code === code);
  const clean = (w) => (w || "").replace(/　/g, " ").replace(/\s+/g, " ").trim();

  function dayInfo(data, target) {
    const tk = dkey(target), out = {};
    const short = data[0].timeSeries;
    const a0 = find(short[0], AREA);
    if (a0) short[0].timeDefines.forEach((t, i) => {
      if (!out.text && dkey(parse(t)) === tk) { out.text = clean(a0.weathers && a0.weathers[i]); out.code = a0.weatherCodes && a0.weatherCodes[i]; }
    });
    const a1 = find(short[1], AREA);
    out.pops = {};
    if (a1) short[1].timeDefines.forEach((t, i) => {
      const d = parse(t);
      if (dkey(d) === tk && a1.pops[i] !== "") out.pops[d.getHours()] = +a1.pops[i];
    });
    const a2 = find(short[2], TEMP);
    if (a2) short[2].timeDefines.forEach((t, i) => {
      const d = parse(t), v = a2.temps[i];
      if (dkey(d) === tk && v !== "") { if (d.getHours() === 0) out.lo = v; else if (d.getHours() === 9) out.hi = v; }
    });
    if (data[1]) {
      const wk = data[1].timeSeries;
      const w0 = find(wk[0], WEEK_AREA);
      if (w0) wk[0].timeDefines.forEach((t, i) => {
        if (dkey(parse(t)) === tk) {
          if (!out.code && w0.weatherCodes) out.code = w0.weatherCodes[i];
          if (!Object.keys(out.pops).length && w0.pops && w0.pops[i] !== "") out.dayPop = +w0.pops[i];
        }
      });
      const w1 = find(wk[1], TEMP);
      if (w1) wk[1].timeDefines.forEach((t, i) => {
        if (dkey(parse(t)) === tk) {
          if (out.lo == null && w1.tempsMin && w1.tempsMin[i]) out.lo = w1.tempsMin[i];
          if (out.hi == null && w1.tempsMax && w1.tempsMax[i]) out.hi = w1.tempsMax[i];
        }
      });
    }
    return out;
  }

  function kind(code, text) {
    const c = String(code || "")[0];
    if (c === "4" || /雪/.test(text || "")) return "snow";
    if (c === "3" || /雨/.test(text || "")) return "rain";
    if (c === "2") return /晴/.test(text || "") ? "partly" : "cloud";
    if (c === "1") return /くもり|曇/.test(text || "") ? "partly" : "sun";
    return "cloud";
  }
  function icon(k) {
    const S = 'fill="none" stroke="#bfe0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
    const sun = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" ${S}/>` +
      [...Array(8)].map((_, i) => { const a = i * Math.PI / 4, r1 = r + 6, r2 = r + 12;
        return `<line x1="${cx + Math.cos(a) * r1}" y1="${cy + Math.sin(a) * r1}" x2="${cx + Math.cos(a) * r2}" y2="${cy + Math.sin(a) * r2}" ${S}/>`; }).join("");
    const cloud = `<path d="M24 66 h42 a14 14 0 0 0 0-28 a20 20 0 0 0-38-4 a15 15 0 0 0-4 32z" ${S} fill="rgba(10,30,70,.85)"/>`;
    const parts = {
      sun: sun(50, 50, 16),
      partly: sun(62, 34, 11) + cloud,
      cloud: cloud,
      rain: cloud + [30, 46, 62].map((x) => `<line x1="${x}" y1="74" x2="${x - 5}" y2="88" ${S}/>`).join(""),
      snow: cloud + [30, 48, 66].map((x) => `<g ${S}><line x1="${x - 5}" y1="81" x2="${x + 5}" y2="81"/><line x1="${x}" y1="76" x2="${x}" y2="86"/></g>`).join(""),
    };
    return `<svg class="wicon" viewBox="0 0 100 100" aria-hidden="true">${parts[k]}</svg>`;
  }

  const SLOTS = [0, 6, 12, 18];
  function maxPop(info) {
    const v = Object.values(info.pops);
    return v.length ? Math.max(...v) : (info.dayPop != null ? info.dayPop : null);
  }

  function render(data) {
    const now = jstNow();
    const tmr = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const t = dayInfo(data, now), m = dayInfo(data, tmr);
    const k = kind(t.code, t.text);
    const nowH = now.getHours();
    const bars = SLOTS.map((h) => {
      const v = t.pops[h];
      const past = h + 6 <= nowH;
      if (v == null) return `<div class="bar na"><div class="v">${past ? "済" : "--"}</div><div class="h">${h}-${h + 6}時</div></div>`;
      return `<div class="bar"><div class="fill" style="height:${v}%"></div><div class="v">${v}%</div><div class="h">${h}-${h + 6}時</div></div>`;
    }).join("");
    const rep = parse(data[0].reportDatetime);
    $("wx").innerHTML = `
      <div class="today">
        ${icon(k)}
        <div>
          <div class="wday">TODAY ${now.getMonth() + 1}/${now.getDate()}(${WD[now.getDay()]})</div>
          <div class="wtext">${t.text || "予報データなし"}</div>
          <div class="temps">
            <span><span class="lbl">最高</span><span class="hi">${t.hi ?? "--"}</span><small>℃</small></span>
            <span><span class="lbl">最低</span><span class="lo">${t.lo ?? "--"}</span><small>℃</small></span>
          </div>
        </div>
      </div>
      <div class="pops"><div class="cap"><span>降水確率</span><span>RAIN PROB.</span></div><div class="bars">${bars}</div></div>
      <div class="tomorrow">
        <span class="wday">明日 ${tmr.getMonth() + 1}/${tmr.getDate()}(${WD[tmr.getDay()]})</span>
        ${icon(kind(m.code, m.text))}
        <span>${m.text || "--"}${maxPop(m) != null ? ` <span style="color:var(--dim)">／雨 ${maxPop(m)}%</span>` : ""}</span>
        <span class="tt"><span class="hi2">${m.hi ?? "--"}</span> / <span class="lo2">${m.lo ?? "--"}</span>℃</span>
      </div>
      <div class="src">出典：気象庁（${rep.getMonth() + 1}月${rep.getDate()}日${rep.getHours()}時 長野地方気象台 発表）。天気と降水確率は長野県中部、気温は${TEMP_NAME}の値よ。</div>`;
    $("live").textContent = "LIVE";
    return { t, m, k };
  }

  function lineFor({ t, m }) {
    const now = jstNow(), h = now.getHours();
    const parts = [];
    let greet = h < 10 ? "おはよう" : h < 17 ? "おつかれさま" : "おつかれさま、今日もがんばったね";
    if (Math.random() < 0.2) greet = "りえちゃん…あ。川村さん！ " + greet;
    else greet = "川村さん、" + greet;
    parts.push(greet + "。");
    const useTomorrow = h >= 17;
    const d = useTomorrow ? m : t;
    const when = useTomorrow ? "明日" : "今日";
    if (d.text) parts.push(`${when}の上田は「${d.text.split(" ")[0]}」なのよ。`);
    if (d.hi != null || d.lo != null) parts.push(`最高${d.hi ?? "?"}度、最低${d.lo ?? "?"}度ね。`);
    const p = useTomorrow ? maxPop(d) : Math.max(-1, ...SLOTS.filter((s) => s + 6 > h).map((s) => d.pops[s] ?? -1));
    if (p >= 50) parts.push("傘を忘れないでね。");
    else if (p >= 30) parts.push("念のため折りたたみ傘があると安心よ。");
    if (d.lo != null && +d.lo <= 0) parts.push("朝は道が凍ってるかも。足元に気をつけてね。");
    else if (d.hi != null && +d.hi >= 33) parts.push("すごく暑いから、こまめにお水を飲んでね。");
    return parts.join("");
  }

  let started = false, firstLine = true;
  async function loadWeather() {
    try {
      $("live").textContent = "RECEIVING";
      const r = await fetch(JMA_URL, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      const info = render(data);
      store.set("stackWx", JSON.stringify(data));
      if (firstLine) { say(lineFor(info)); firstLine = false; }
      else lastLine = lineFor(info);
    } catch (e) {
      const cached = store.get("stackWx");
      if (cached) {
        try { const info = render(JSON.parse(cached)); $("live").textContent = "OFFLINE"; if (firstLine) { say("通信が切れてるみたい。前に受け取った天気を出してるのよ。"); firstLine = false; } lastLine = lineFor(info); return; } catch {}
      }
      $("live").textContent = "NO SIGNAL";
      $("wx").innerHTML = `<div class="err">気象庁のデータを受け取れなかったよ。<br>電波を確認して、もう一回ためしてね。<br><button class="btn" id="retry" type="button">もう一回</button></div>`;
      $("retry").onclick = loadWeather;
      if (firstLine) { say("ごめんね、天気のデータが届かないのよ。それはぼくのデータにない、ってやつね。"); firstLine = false; }
    }
  }
  function startMain() {
    if (started) return; started = true;
    loadWeather();
    setInterval(loadWeather, REFRESH_MIN * 60000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadWeather(); });
  }
  window.__stackSay = say; // 将来スタックから文字を届ける入口
})();

/* =========================================================
   背景（飾り）: 青く光る雲・漂う破片・走査線・薄い円
   ＋ 両端に流れる数字の列、浮かぶ小さなグラフと波形
   ========================================================= */
(() => {
  const cv = document.getElementById("bg");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, R, cx, cy, dpr, small;

  const sprite = document.createElement("canvas");
  sprite.width = sprite.height = 64;
  const sg = sprite.getContext("2d");
  const g = sg.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(160,205,255,1)");
  g.addColorStop(0.25, "rgba(70,140,255,0.55)");
  g.addColorStop(1, "rgba(20,60,200,0)");
  sg.fillStyle = g; sg.fillRect(0, 0, 64, 64);

  const rnd = (a, b) => a + Math.random() * (b - a);
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
  const lobes = [[0,0,1],[-.35,-.15,.7],[.4,-.1,.65],[.05,.35,.6],[-.2,.3,.5],[.3,.3,.45]];
  let neb = [], shards = [], bubbles = [], streaks = [], cols = [], widgets = [];
  const HEX = "0123456789ABCDEF";
  const randStr = (n) => Array.from({ length: n }, () => HEX[(Math.random() * 16) | 0]).join("");

  function build() {
    small = Math.min(W, H) < 600;
    neb = [];
    const N = small ? 600 : 1000;
    for (let i = 0; i < N; i++) {
      const L = lobes[i % lobes.length];
      const ox = L[0] + gauss() * .7 * L[2], oy = L[1] * .8 + gauss() * .55 * L[2];
      neb.push({ a: Math.atan2(oy, ox), r: Math.hypot(ox, oy), s: rnd(.15, 1.1) * (Math.random() < .08 ? 2.2 : 1),
        al: rnd(.04, .16), sp: rnd(-.02, .02), ph: rnd(0, 6.28) });
    }
    shards = []; for (let i = 0; i < (small ? 50 : 90); i++) shards.push(newShard(true));
    bubbles = []; for (let i = 0; i < 14; i++) bubbles.push({ x: rnd(-1.4, 1.4), y: rnd(-.9, .9), r: rnd(.008, .03), v: rnd(.002, .006) });
    streaks = []; for (let i = 0; i < 7; i++) streaks.push({ y: rnd(-.6, .6), x: rnd(-1, 1), len: rnd(.15, .5), v: rnd(.02, .07) * (Math.random() < .5 ? -1 : 1) });
    // 流れる数字の列（左右の端）
    cols = [];
    const nCol = small ? 3 : 6, fs = small ? 10 : 12;
    for (let i = 0; i < nCol; i++) {
      const left = i % 2 === 0, k = Math.floor(i / 2);
      cols.push({ x: left ? 6 + k * fs * 1.1 : W - 14 - k * fs * 1.1, y: rnd(0, H), v: rnd(18, 45), fs,
        chars: randStr(Math.ceil(H / fs) + 4), al: rnd(.12, .3) });
    }
    // 浮かぶ小さいグラフ（意味なし）
    widgets = [];
    const wW = small ? 96 : 150, wH = small ? 40 : 56;
    const spots = small ? [[.06, .12]] : [[.06, .2], [.78, .16], [.05, .72], [.8, .7]];
    spots.forEach(([fx, fy], i) => widgets.push({ x: fx * W, y: fy * H, w: wW, h: wH, type: i % 2 ? "bars" : "wave",
      ph: rnd(0, 6), data: Array.from({ length: 12 }, () => rnd(.2, 1)), label: randStr(4) + "-" + randStr(2) }));
  }

  function newShard(anywhere) {
    const n = Math.floor(rnd(4, 7)), pts = [];
    for (let k = 0; k < n; k++) { const t = k / n * 6.28 + rnd(-.3, .3); pts.push([Math.cos(t) * rnd(.6, 1), Math.sin(t) * rnd(.6, 1)]); }
    const a = rnd(0, 6.28), d = anywhere ? Math.pow(Math.random(), .7) * 1.1 : rnd(.05, .3);
    return { x: Math.cos(a) * d * 1.3, y: Math.sin(a) * d * .9, pts, size: rnd(.006, .022) * (Math.random() < .12 ? 2 : 1),
      rot: rnd(0, 6.28), vr: rnd(-.25, .25), vx: Math.cos(a) * rnd(.004, .014), vy: Math.sin(a) * rnd(.003, .01),
      warm: Math.random() < .35, al: rnd(.45, .95) };
  }

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H / 2; R = Math.min(W, H) * (W < H ? .55 : .42);
    build();
  }

  let last = 0;
  function frame(t) {
    const time = t / 1000, dt = Math.min(.05, last ? time - last : 1 / 60); last = time;
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * .75);
    bg.addColorStop(0, "#0a1c44"); bg.addColorStop(.45, "#06122a"); bg.addColorStop(1, "#02040b");
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // 薄い円
    ctx.strokeStyle = "rgba(110,160,255,0.10)"; ctx.lineWidth = 1;
    for (const k of [.78, 1.02]) { ctx.beginPath(); ctx.arc(cx, cy, R * k, 0, 6.28); ctx.stroke(); }
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(time * .05);
    ctx.setLineDash([2, 10]); ctx.strokeStyle = "rgba(140,190,255,0.16)";
    ctx.beginPath(); ctx.arc(0, 0, R * .9, 0, 6.28); ctx.stroke(); ctx.restore(); ctx.setLineDash([]);

    // 流れる数字
    ctx.font = `${small ? 10 : 12}px "Share Tech Mono", monospace`;
    for (const c of cols) {
      c.y += c.v * dt; if (c.y > c.fs * 4) { c.y -= c.fs; c.chars = HEX[(Math.random() * 16) | 0] + c.chars.slice(0, -1); }
      for (let i = 0; i < c.chars.length; i++) {
        const y = c.y + (i - 4) * c.fs; if (y < -c.fs || y > H + c.fs) continue;
        ctx.fillStyle = i === 4 ? `rgba(210,235,255,${c.al + .3})` : `rgba(90,160,255,${c.al * (1 - i / c.chars.length * .6)})`;
        ctx.fillText(c.chars[i], c.x, y);
      }
    }

    // 雲（加算合成）
    ctx.globalCompositeOperation = "lighter";
    const breathe = 1 + Math.sin(time * .4) * .025;
    for (const p of neb) {
      const a = p.a + time * p.sp, rr = p.r * breathe * (1 + Math.sin(time * .7 + p.ph) * .02);
      const x = cx + Math.cos(a) * rr * R, y = cy + Math.sin(a) * rr * R * .85, s = p.s * R * .32;
      ctx.globalAlpha = p.al * (.85 + Math.sin(time * 1.3 + p.ph) * .15);
      ctx.drawImage(sprite, x - s / 2, y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    for (let i = 0; i < neb.length; i += 9) {
      const p = neb[i], a = p.a + time * p.sp;
      const x = cx + Math.cos(a) * p.r * breathe * R, y = cy + Math.sin(a) * p.r * breathe * R * .85;
      ctx.fillStyle = `rgba(190,225,255,${.25 + .35 * Math.abs(Math.sin(time * 2 + p.ph))})`;
      ctx.fillRect(x, y, 1.2, 1.2);
    }
    ctx.globalCompositeOperation = "source-over";

    // 走査線と流れる光
    for (let y = -0.62; y <= 0.62; y += 0.031) {
      const yy = cy + y * R * 1.3, fade = 1 - Math.abs(y) / .7;
      ctx.strokeStyle = `rgba(150,190,255,${.05 + .06 * fade})`;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy + Math.sin(y * 9) * 2); ctx.stroke();
    }
    for (const s of streaks) {
      s.x += s.v * dt; if (s.x > 1.6) s.x = -1.6; if (s.x < -1.6) s.x = 1.6;
      const x0 = cx + s.x * R * 1.5, yy = cy + s.y * R * 1.3, L = s.len * R;
      const lg = ctx.createLinearGradient(x0 - L, 0, x0 + L, 0);
      lg.addColorStop(0, "rgba(180,215,255,0)"); lg.addColorStop(.5, "rgba(200,230,255,.55)"); lg.addColorStop(1, "rgba(180,215,255,0)");
      ctx.strokeStyle = lg; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0 - L, yy); ctx.lineTo(x0 + L, yy); ctx.stroke();
    }

    // 泡
    ctx.strokeStyle = "rgba(170,205,255,0.35)";
    for (const b of bubbles) {
      b.y -= b.v * dt; if (b.y < -1) b.y = 1;
      ctx.beginPath(); ctx.arc(cx + b.x * R, cy + b.y * R, b.r * R, 0, 6.28); ctx.stroke();
    }

    // 破片
    for (let i = 0; i < shards.length; i++) {
      const s = shards[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
      if (Math.abs(s.x) > 1.7 || Math.abs(s.y) > 1.2) { shards[i] = newShard(false); continue; }
      const x = cx + s.x * R, y = cy + s.y * R, z = s.size * R, dist = Math.hypot(s.x, s.y);
      ctx.save(); ctx.translate(x, y); ctx.rotate(s.rot);
      ctx.globalAlpha = s.al * Math.min(1, dist * 4) * Math.max(0, 1 - (dist - 1.2) * 2);
      ctx.fillStyle = s.warm ? "#efe6d6" : "#dfeaff";
      ctx.beginPath(); s.pts.forEach(([px, py], k) => k ? ctx.lineTo(px * z, py * z) : ctx.moveTo(px * z, py * z));
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.globalAlpha = 1;

    // 浮かぶグラフ
    ctx.font = `9px "Share Tech Mono", monospace`;
    for (const w of widgets) {
      const fy = w.y + Math.sin(time * .3 + w.ph) * 6;
      ctx.strokeStyle = "rgba(110,170,255,.22)"; ctx.lineWidth = 1;
      ctx.strokeRect(w.x, fy, w.w, w.h);
      ctx.fillStyle = "rgba(120,175,255,.45)"; ctx.fillText(w.label, w.x + 4, fy - 4);
      if (w.type === "wave") {
        ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
          const px = w.x + i / 40 * w.w;
          const py = fy + w.h / 2 + Math.sin(i * .5 + time * 2.2 + w.ph) * w.h * .28 * Math.sin(i * .09 + time * .5);
          i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.strokeStyle = "rgba(150,205,255,.55)"; ctx.stroke();
      } else {
        const n = w.data.length, bw = w.w / n;
        if (Math.random() < .03) { w.data.shift(); w.data.push(rnd(.15, 1)); }
        w.data.forEach((v, i) => {
          const hh = v * (w.h - 8) * (.9 + .1 * Math.sin(time * 3 + i));
          ctx.fillStyle = "rgba(90,160,255,.4)";
          ctx.fillRect(w.x + i * bw + 2, fy + w.h - 3 - hh, bw - 4, hh);
        });
      }
    }

    // 周辺を暗く
    const vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * .3, cx, cy, Math.max(W, H) * .8);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.65)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    if (!reduce) requestAnimationFrame(frame);
  }

  addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
