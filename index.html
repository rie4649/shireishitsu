<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スタック</title>
<meta name="theme-color" content="#02040b">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スタック">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  /* =========================================================
     スタック司令室  ver 2.0
     ふだんは背景だけ。スタックから通信が届いたら中央に出る。
     ========================================================= */
  :root {
    --void: #02040b;
    --glow: #3d8bff;
    --glow2: #7fb6ff;
    --ice: #cfe3ff;
    --dim: #6f8fbf;
    --warn: #ffcf7a;
    --line: rgba(120, 175, 255, .28);
    --mono: "Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--void); color: var(--ice); font-family: var(--jp); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .app {
    position: fixed; inset: 0;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-rows: auto 1fr auto auto; grid-template-columns: minmax(0, 1fr); gap: 10px; pointer-events: none;
  }
  .app > * { pointer-events: auto; }
  .app.locked { visibility: hidden; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--dim); }
  .topbar .tag { color: var(--ice); white-space: nowrap; }
  .topbar .tag b { color: var(--glow); font-weight: 400; }
  .topbar .sub { margin-top: 4px; font-size: 10px; }
  .clock { text-align: right; font-variant-numeric: tabular-nums; }
  .clock .t { color: var(--ice); font-size: 15px; }
  #link.on { color: var(--glow2); } #link.off { color: var(--warn); }

  /* ---------- 中央: 受信パネル ---------- */
  .center { display: flex; align-items: center; justify-content: center; min-height: 0; pointer-events: none; }
  .rx {
    pointer-events: auto; width: min(560px, 100%); max-height: 100%; overflow-y: auto;
    background: linear-gradient(180deg, rgba(8, 24, 58, .86), rgba(3, 10, 28, .9));
    border: 1px solid var(--line); border-radius: 6px; position: relative;
    box-shadow: 0 0 40px rgba(40,110,255,.25), 0 0 60px rgba(40,110,255,.15) inset;
    padding: 14px 18px 14px;
    opacity: 0; transform: scale(.96); filter: blur(4px);
    transition: opacity .5s, transform .5s, filter .5s; visibility: hidden;
  }
  .rx.show { opacity: 1; transform: none; filter: none; visibility: visible; }
  .rx::before, .rx::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--glow2); }
  .rx::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .rx::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .rx .hd { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 11px;
    letter-spacing: .16em; color: var(--glow2); border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 10px; }
  .rx .hd .when { color: var(--dim); }
  .rx h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; text-shadow: 0 0 12px rgba(80,150,255,.55); }
  .rx .say { font-size: 15px; line-height: 1.75; }
  .rx .say::after { content: "▍"; color: var(--glow2); animation: blink 1s steps(2) infinite; }
  .rx .say.done::after { content: ""; }
  .rx dl { margin-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px;
    border-top: 1px dashed var(--line); padding-top: 10px; }
  .rx dt { color: var(--dim); font-size: 12px; padding-top: 2px; white-space: nowrap; }
  .rx dd { font-family: var(--jp); }
  .rx dd.num { font-family: var(--mono); font-size: 16px; color: #e6f1ff; }
  .rx .x { position: absolute; top: 6px; right: 8px; }
  .rx .hd { padding-right: 22px; }
  .rx .bar { height: 2px; background: var(--glow); margin-top: 12px; transform-origin: left; }
  @keyframes blink { 50% { opacity: .2; } }

  /* ---------- 下: スタックと状態 ---------- */
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .status { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--dim); line-height: 1.9; }
  .status .st::before { content: "●"; margin-right: 6px; color: var(--glow2); animation: blink 1.6s steps(2) infinite; }
  .btns { display: flex; gap: 8px; margin-top: 6px; }
  .stack { width: 78px; flex: 0 0 auto; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; }
  .stack svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 10px rgba(61,139,255,.55)); }
  .stack .cap { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; color: var(--dim); text-align: center; margin-top: 2px; }

  button.btn, button.chip {
    font-family: var(--jp); color: var(--ice); cursor: pointer;
    background: rgba(61,139,255,.16); border: 1px solid var(--glow); border-radius: 4px;
  }
  button.btn { font-size: 14px; padding: 8px 16px; }
  button.chip { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; padding: 5px 10px; background: rgba(4,14,36,.7); border-color: var(--line); color: var(--glow2); }
  button:active { background: rgba(61,139,255,.35); }
  button.ghost { background: none; border: 0; color: var(--dim); font-size: 18px; cursor: pointer; }

  /* ---------- 引き出し(LOG / 設定) ---------- */
  .sheet { position: fixed; inset: 0; z-index: 8; background: rgba(1,3,9,.7); display: flex; align-items: flex-end; justify-content: center; }
  .sheet[hidden] { display: none; }
  .sheet .in {
    width: min(560px, 100%); max-height: 80vh; overflow-y: auto;
    background: #050d22; border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0;
    padding: 14px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .sheet .hd { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono);
    letter-spacing: .16em; font-size: 12px; color: var(--glow2); margin-bottom: 10px; }
  .log-item { border-top: 1px solid var(--line); padding: 10px 0; cursor: pointer; }
  .log-item .w { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .log-item .s { font-size: 14px; line-height: 1.6; margin-top: 2px; }
  .empty { color: var(--dim); font-size: 13px; padding: 12px 0; }
  .set p { font-size: 13px; line-height: 1.75; color: var(--ice); margin-bottom: 10px; }
  .set .key { font-family: var(--mono); font-size: 14px; word-break: break-all; user-select: all;
    background: rgba(2,8,22,.8); border: 1px dashed var(--glow2); padding: 10px; border-radius: 4px; margin: 6px 0 10px; }
  .set .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .note { min-height: 1.4em; font-size: 13px; color: var(--warn); margin-top: 6px; }

  /* ---------- 合言葉ゲート ---------- */
  .gate { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(6,18,42,.55), rgba(2,4,11,.92)); padding: 16px; }
  .gate[hidden] { display: none; }
  .gate .box { width: min(360px, 100%); text-align: center; }
  .gate .k { font-family: var(--mono); letter-spacing: .3em; font-size: 12px; color: var(--glow2); margin-bottom: 14px; }
  .gate h1 { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
  .gate p { font-size: 12px; color: var(--dim); line-height: 1.7; margin-bottom: 14px; }
  .gate input { width: 100%; font-size: 18px; text-align: center; letter-spacing: .1em; background: rgba(2,8,22,.8);
    color: var(--ice); border: 1px solid var(--glow); border-radius: 4px; padding: 10px; margin-bottom: 10px; outline: none; font-family: var(--jp); }
  .gate input:focus { box-shadow: 0 0 0 3px rgba(61,139,255,.3); }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  /* ---------- 話しかけ欄 ---------- */
  .talk { display: flex; flex-direction: column; gap: 6px; width: min(560px, 100%); min-width: 0; justify-self: center; }
  .talk form { display: flex; gap: 8px; }
  .talk input[type=text] { flex: 1; min-width: 0; font-size: 16px; font-family: var(--jp); color: var(--ice);
    background: rgba(2,8,22,.85); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; outline: none; }
  .talk input[type=text]:focus { border-color: var(--glow); box-shadow: 0 0 0 3px rgba(61,139,255,.25); }
  .talk .opts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--dim); }
  .talk .opts label { display: inline-flex; gap: 4px; align-items: center; margin-right: 6px; }
  .talk .quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .talk .quick::-webkit-scrollbar { display: none; }
  .talk .quick button { white-space: nowrap; font-family: var(--jp); letter-spacing: 0; font-size: 12px; }
  .talk .sending { color: var(--glow2); font-family: var(--mono); font-size: 11px; letter-spacing: .12em; min-height: 1.2em; }

  @media (max-width: 520px) {
    .topbar { font-size: 10px; letter-spacing: .1em; }
    .topbar .tag .long { display: none; }
    .rx { padding: 12px 14px; }
    .rx h2 { font-size: 16px; }
    .rx .say { font-size: 14px; }
    .stack { width: 66px; }
  }
  @media (prefers-reduced-motion: reduce) { .status .st::before, .rx .say::after { animation: none; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="app locked" id="app" aria-hidden="true">
  <header class="topbar">
    <div><div class="tag"><b>■</b> STACK<span class="long"> // COMMAND ROOM</span></div>
      <div class="sub">LINK ▸ <span id="link">----</span></div></div>
    <div class="clock"><div class="t" id="clock">--:--:--</div><div id="date">----</div></div>
  </header>

  <main class="center">
    <section class="rx" id="rx" aria-live="polite">
      <button class="ghost x" id="rxClose" type="button" aria-label="閉じる">×</button>
      <div class="hd"><span>◤ INCOMING ▸ STACK</span><span class="when" id="rxWhen"></span></div>
      <h2 id="rxTitle"></h2>
      <div class="say" id="rxSay"></div>
      <dl id="rxData"></dl>
      <div class="bar" id="rxBar"></div>
    </section>
  </main>

  <section class="talk" aria-label="スタックに話しかける">
    <div class="quick" id="quick"></div>
    <form id="talkForm" autocomplete="off">
      <input type="text" id="talkIn" placeholder="スタックに話しかける" enterkeyhint="send" aria-label="スタックに話しかける言葉">
      <button class="btn" type="submit" id="talkGo">話す</button>
    </form>
    <div class="opts">
      <label><input type="checkbox" id="optWake" checked>「スタック」と呼びかける</label>
      <label><input type="checkbox" id="optSay">そのまま言わせる</label>
      <span class="sending" id="talkSt"></span>
    </div>
  </section>

  <footer class="bottom">
    <div class="status">
      <div class="st" id="st">STANDBY ▸ 通信待機中</div>
      <div class="btns">
        <button class="chip" id="infoBtn" type="button">INFO</button>
        <button class="chip" id="logBtn" type="button">LOG</button>
        <button class="chip" id="setBtn" type="button">SET</button>
      </div>
    </div>
    <button class="stack" id="stackBtn" type="button" aria-label="スタック（押すと最後の答えをもう一度）">
      <svg viewBox="0 0 100 110" aria-hidden="true">
        <defs><linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2f5c"/><stop offset="1" stop-color="#0a1530"/></linearGradient></defs>
        <rect x="26" y="78" width="48" height="24" rx="8" fill="url(#shell)" stroke="#5c9bff" stroke-width="1.5"/>
        <rect x="18" y="96" width="22" height="9" rx="4" fill="#0e1c3e" stroke="#5c9bff" stroke-width="1.2"/>
        <rect x="60" y="96" width="22" height="9" rx="4" fill="#0e1c3e" stroke="#5c9bff" stroke-width="1.2"/>
        <circle cx="50" cy="90" r="3" fill="#7fb6ff"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
        <rect x="8" y="10" width="84" height="68" rx="14" fill="url(#shell)" stroke="#7fb6ff" stroke-width="2"/>
        <path d="M8 40 h-4 v16 h4" fill="none" stroke="#7fb6ff" stroke-width="2"/>
        <path d="M4 54 q0 14 18 16" fill="none" stroke="#7fb6ff" stroke-width="1.5"/>
        <circle cx="23" cy="70" r="2.2" fill="#7fb6ff"/>
        <rect x="16" y="18" width="68" height="52" rx="8" fill="#030914"/>
        <g id="eyes" fill="#d6e8ff"><rect x="30" y="34" width="9" height="12" rx="4.5"/><rect x="61" y="34" width="9" height="12" rx="4.5"/></g>
        <ellipse id="mouth" cx="50" cy="56" rx="8" ry="1.2" fill="#d6e8ff"/>
      </svg>
      <div class="cap">STACK</div>
    </button>
  </footer>
</div>

<div class="sheet" id="logSheet" hidden><div class="in">
  <div class="hd"><span>TRANSMISSION LOG</span><button class="ghost" data-close type="button" aria-label="閉じる">×</button></div>
  <div id="logList"></div>
</div></div>

<div class="sheet" id="infoSheet" hidden><div class="in set">
  <div class="hd"><span>INFORMATION</span><button class="ghost" data-close type="button" aria-label="閉じる">×</button></div>
  <div class="row" id="infoBtns">
    <button class="btn" data-info="today" type="button">今日の天気</button>
    <button class="btn" data-info="tomorrow" type="button">明日の天気</button>
    <button class="btn" data-info="week" type="button">週間天気</button>
    <button class="btn" data-info="warn" type="button">警報・注意報</button>
    <button class="btn" data-info="sky" type="button">日の出・月</button>
    <button class="btn" data-info="memo" type="button">やることメモ</button>
  </div>
  <div class="note" id="infoNote"></div>
</div></div>

<div class="sheet" id="memoSheet" hidden><div class="in set">
  <div class="hd"><span>MEMO</span><button class="ghost" data-close type="button" aria-label="閉じる">×</button></div>
  <form id="memoForm" class="row" autocomplete="off" style="flex-wrap:nowrap">
    <input type="text" id="memoIn" placeholder="やることを書く" aria-label="やること" style="flex:1;min-width:0;font-size:16px;font-family:var(--jp);color:var(--ice);background:rgba(2,8,22,.85);border:1px solid var(--line);border-radius:4px;padding:9px 10px;outline:none">
    <button class="btn" type="submit">追加</button>
  </form>
  <div id="memoList"></div>
</div></div>

<div class="sheet" id="setSheet" hidden><div class="in set">
  <div class="hd"><span>SETTINGS</span><button class="ghost" data-close type="button" aria-label="閉じる">×</button></div>
  <p><b>通信キー</b><br>スタックの道具プログラム(パソコン)の settings.txt に貼る合いカギよ。チャットには貼らないでね。</p>
  <div class="key" id="keyBox">----</div>
  <div class="row"><button class="btn" id="copyKey" type="button">コピーする</button></div>
  <p><b>テスト受信</b><br>スタックがいなくても、中継を通って画面に届くか試せるよ。</p>
  <div class="row">
    <button class="btn" id="testHello" type="button">あいさつを送る</button>
    <button class="btn" id="testWx" type="button">上田の天気を送る</button>
  </div>
  <div class="note" id="setNote"></div>
</div></div>

<div class="gate" id="gate"><div class="box" id="gateBox"></div></div>

<script>
/* ===== 合言葉の登録コード（川村さんが決めた合言葉から作ったもの） ===== */
const PASS_CODE = "dcbbd13c783a25d504eed386ea8c7e7d";
const SALT = "stack-shireishitsu-v1";
const LINK_SALT = "stack-link-v1";          // 通信キーを作るための別の塩
const RELAY = "https://ntfy.sh/";           // 無料の中継サービス
const SHOW_SEC = 120;                       // 届いた答えを出しておく秒数

(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------------- 合言葉 → 通信キー ---------------- */
  async function derive(p, salt, bits) {
    const norm = p.normalize("NFKC").trim().replace(/\s+/g, "");
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey("raw", enc.encode(norm), "PBKDF2", false, ["deriveBits"]);
    const b = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(salt), iterations: 150000, hash: "SHA-256" }, key, bits);
    return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  }
  const gate = $("gate"), box = $("gateBox"), app = $("app");
  let TOPIC = null, started = false;

  function openApp() {
    gate.hidden = true; app.classList.remove("locked"); app.removeAttribute("aria-hidden");
    $("keyBox").textContent = TOPIC;
    startMain();
  }
  function showLogin() {
    box.innerHTML = `
      <div class="k">ACCESS CHECK</div><h1>合言葉をどうぞ</h1><p>司令室に入るための合言葉よ。</p>
      <form id="f"><input id="pw" type="password" autocomplete="current-password" aria-label="合言葉">
      <button class="btn" type="submit">解除する</button></form><div class="note" id="note"></div>`;
    const pw = $("pw"); pw.focus();
    $("f").onsubmit = async (e) => {
      e.preventDefault();
      if (!pw.value.trim()) return;
      if ((await derive(pw.value, SALT, 128)) === PASS_CODE) {
        TOPIC = "stk" + (await derive(pw.value, LINK_SALT, 96));
        store.set("stackPass", PASS_CODE); store.set("stackTopic", TOPIC);
        openApp();
      } else {
        $("note").textContent = "それはぼくのデータにないよ。もう一回ね。";
        box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); pw.select();
      }
    };
  }

  /* ---------------- 時計 ---------------- */
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  const p2 = (x) => String(x).padStart(2, "0");
  function jst(d = new Date()) { return new Date(d.getTime() + (d.getTimezoneOffset() + 540) * 60000); }
  function tick() {
    const n = jst();
    $("clock").textContent = `${p2(n.getHours())}:${p2(n.getMinutes())}:${p2(n.getSeconds())}`;
    $("date").textContent = `${n.getFullYear()}.${p2(n.getMonth() + 1)}.${p2(n.getDate())} ${WD[n.getDay()]}`;
  }
  tick(); setInterval(tick, 1000);

  /* ---------------- スタックの口 ---------------- */
  const mouth = $("mouth");
  const setMouth = (open) => mouth.setAttribute("ry", open ? (3 + Math.random() * 4).toFixed(1) : "1.2");
  const eyes = $("eyes");
  setInterval(() => { eyes.setAttribute("transform", "translate(0 40) scale(1 .1) translate(0 -40)"); setTimeout(() => eyes.removeAttribute("transform"), 140); }, 4200);
  function speakAloud(text) {
    if (!("speechSynthesis" in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…+/g, "、"));
    u.lang = "ja-JP"; u.rate = 1.05; u.pitch = 1.35;
    const v = speechSynthesis.getVoices().find((x) => x.lang && x.lang.startsWith("ja")); if (v) u.voice = v;
    let flap = null;
    u.onstart = () => { flap = setInterval(() => setMouth(Math.random() > .35), 110); };
    u.onend = u.onerror = () => { clearInterval(flap); setMouth(false); };
    speechSynthesis.speak(u);
  }

  /* ---------------- 受信パネル ---------------- */
  const rx = $("rx");
  let typeTimer = null, hideTimer = null, current = null;
  function timeLabel(ms) { const d = jst(new Date(ms)); return `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; }
  function dataRows(data) {
    if (!data || typeof data !== "object") return "";
    return Object.entries(data).filter(([, v]) => v !== "" && v != null).slice(0, 14).map(([k, v]) => {
      const val = typeof v === "object" ? JSON.stringify(v) : String(v);
      const num = /^[-+]?\d+(\.\d+)?\s*(度|℃|%|％)?$/.test(val.trim());
      return `<dt>${esc(k)}</dt><dd class="${num ? "num" : ""}">${esc(val)}</dd>`;
    }).join("");
  }
  function show(msg, opts = {}) {

  function getLog() { try { return JSON.parse(store.get("stackLog") || "[]"); } catch { return []; } }
  function addLog(m) {
    const log = getLog();

  /* ---------------- 中継(ntfy)から受け取る ---------------- */
  function normalize(n) {
    // n = ntfy のメッセージ。本文は JSON {title, text, data} か、ただの文字
    let body = n.message || "", m = {};
    try { const j = JSON.parse(body); if (j && typeof j === "object") m = j; else m = { text: String(j) }; } catch { m = { text: body }; }
    return { id: n.id, time: (n.time || Date.now() / 1000) * 1000, title: m.title || n.title || "", text: m.text || "", data: m.data || null };
  }
  function receive(n, live) {
    if (n.event && n.event !== "message") return;
    const m = normalize(n);
    if (addLog(m) && live) show(m);
  }
  let es = null, retry = 2;
  function setLink(on) { const el = $("link"); el.textContent = on ? "ONLINE" : "OFFLINE"; el.className = on ? "on" : "off"; window.__bgLink && window.__bgLink(on); }
  async function catchUp() {
    // 開いていない間に届いた分を LOG に入れて、10分以内のものは表示
    try {
      const r = await fetch(`${RELAY}${TOPIC}/json?poll=1&since=12h`);
      if (!r.ok) return;
      const lines = (await r.text()).trim().split("\n").filter(Boolean).map((l) => JSON.parse(l));
      let latest = null;
      for (const n of lines) { if (n.event !== "message") continue; const m = normalize(n); addLog(m); if (!latest || m.time > latest.time) latest = m; }
      if (latest && Date.now() - latest.time < 10 * 60000) show(latest);
    } catch {}
  }
  function connect() {
    if (es) es.close();
    try { es = new EventSource(`${RELAY}${TOPIC}/sse`); } catch { setLink(false); return; }
    es.onopen = () => { setLink(true); retry = 2; };
    es.onmessage = (e) => { try { receive(JSON.parse(e.data), true); } catch {} };
    es.onerror = () => {
      setLink(false);
      if (es.readyState === 2) { setTimeout(connect, retry * 1000); retry = Math.min(retry * 2, 60); }
    };
  }
  async function publish(obj) {
    const r = await fetch(`${RELAY}${TOPIC}`, { method: "POST", body: JSON.stringify(obj) });

  // テスト用：上田市の天気（気象庁）。本番はスタックの道具プログラムが送る
  async function uedaWeather(off) {
    const r = await fetch("https://www.jma.go.jp/bosai/forecast/data/forecast/200000.json", { cache: "no-store" });
    const data = await r.json();
    const now = jst(), h = now.getHours(), useT = off == null ? h >= 17 : off === 1;
    const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (useT ? 1 : 0));
    const key = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const tk = key(target), find = (s, c) => (s.areas || []).find((a) => a.area.code === c);
    const S = data[0].timeSeries, out = {};
    const a0 = find(S[0], "200020");
    S[0].timeDefines.forEach((t, i) => { if (!out["天気"] && key(jst(new Date(t))) === tk) out["天気"] = a0.weathers[i].replace(/　/g, " ").replace(/\s+/g, " "); });
    const a1 = find(S[1], "200020"), pops = [];
    S[1].timeDefines.forEach((t, i) => { const d = jst(new Date(t)); if (key(d) === tk && a1.pops[i] !== "") pops.push(`${d.getHours()}時〜 ${a1.pops[i]}%`); });
    if (pops.length) out["降水確率"] = pops.join(" / ");
    const a2 = find(S[2], "48156");
    S[2].timeDefines.forEach((t, i) => { const d = jst(new Date(t)); if (key(d) === tk && a2.temps[i] !== "") out[d.getHours() === 0 ? "最低気温" : "最高気温"] = a2.temps[i] + "度"; });

  const WARN = { "02":"暴風雪警報","03":"大雨警報","04":"洪水警報","05":"暴風警報","06":"大雪警報","10":"大雨注意報","12":"大雪注意報","13":"風雪注意報","14":"雷注意報","15":"強風注意報","17":"融雪注意報","18":"洪水注意報","20":"濃霧注意報","21":"乾燥注意報","22":"なだれ注意報","23":"低温注意報","24":"霜注意報","25":"着氷注意報","26":"着雪注意報","32":"暴風雪特別警報","33":"大雨特別警報","35":"暴風特別警報","36":"大雪特別警報" };
  async function warnings() {

  // 日の出・日の入り(上田市 北緯36.40 東経138.25)と月齢
  function sunTimes(date, lat = 36.40, lng = 138.25) {
    const rad = Math.PI / 180, day = 86400000, J1970 = 2440588, J2000 = 2451545;
    const toJ = (d) => d.valueOf() / day - .5 + J1970, fromJ = (j) => new Date((j + .5 - J1970) * day);
    const d = toJ(date) - J2000, lw = rad * -lng, phi = rad * lat;
    const n = Math.round(d - .0009 - lw / (2 * Math.PI));
    const ds = .0009 + lw / (2 * Math.PI) + n;
    const M = rad * (357.5291 + .98560028 * ds);
    const C = rad * (1.9148 * Math.sin(M) + .02 * Math.sin(2 * M) + .0003 * Math.sin(3 * M));
    const L = M + C + rad * 102.9372 + Math.PI;
    const dec = Math.asin(Math.sin(L) * Math.sin(rad * 23.4397));
    const Jnoon = J2000 + ds + .0053 * Math.sin(M) - .0069 * Math.sin(2 * L);
    const w = Math.acos((Math.sin(rad * -.833) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
    const a = .0009 + (w + lw) / (2 * Math.PI) + n;
    const Jset = J2000 + a + .0053 * Math.sin(M) - .0069 * Math.sin(2 * L);
    return { rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset) };
  }
  function sky() {
    const now = new Date(), st = sunTimes(now);
    const hm = (d) => { const j = jst(d); return `${j.getHours()}時${p2(j.getMinutes())}分`; };
    const age = (((now - Date.UTC(2000, 0, 6, 18, 14)) / 86400000) % 29.530588 + 29.530588) % 29.530588;
    const names = [[1, "新月"], [3.5, "三日月"], [6, "三日月すぎ"], [9, "上弦の月"], [13, "十三夜"], [16, "満月"], [20, "立待月〜寝待月"], [24, "下弦の月"], [28, "有明の月"], [30, "新月"]];
    const name = names.find(([lim]) => age < lim)[1];
    const len = (st.set - st.rise) / 60000;
    return { title: "日の出・日の入りと月(上田市)", text: `今日の日の出は${hm(st.rise)}、日の入りは${hm(st.set)}よ。月は「${name}」ね。`,
      data: { "日の出": hm(st.rise), "日の入り": hm(st.set), "昼の長さ": `${Math.floor(len / 60)}時間${Math.round(len % 60)}分`, "月齢": age.toFixed(1), "月": name } };
  }

/* =========================================================
   背景(飾り): 銀河の星雲 / 星空 / 光の糸 / 横の線 / 薄い目盛りリング

(() => {
  const cv = document.getElementById("bg");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, R, cx, cy, dpr, small;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const HEX = "0123456789ABCDEF";
  const randStr = (n) => Array.from({ length: n }, () => HEX[(Math.random() * 16) | 0]).join("");

  function makeSprite(stops) {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const x = c.getContext("2d"), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    stops.forEach(([o, col]) => g.addColorStop(o, col));
    x.fillStyle = g; x.fillRect(0, 0, 64, 64); return c;
  }
  const blue = makeSprite([[0, "rgba(120,170,255,1)"], [.3, "rgba(50,110,255,.5)"], [1, "rgba(20,50,200,0)"]]);
  const white = makeSprite([[0, "rgba(255,255,255,1)"], [.25, "rgba(200,225,255,.6)"], [1, "rgba(120,170,255,0)"]]);

  let lobes = [], neb = [], dust = [], stars = [], strings = [], cols = [];
  let pulse = 0, linked = false;
  window.__bgPulse = () => { pulse = 1; };
  window.__bgLink = (on) => { linked = on; };

  function build() {
    small = Math.min(W, H) < 600;
    // 星雲: もこもこした雲のかたまり(いくつもの玉の集まり)
    lobes = [];
    const nL = 16;
    for (let i = 0; i < nL; i++) {
      const a = rnd(0, 6.28), d = Math.pow(Math.random(), .8) * .55;
      lobes.push({ x: Math.cos(a) * d * 1.15, y: Math.sin(a) * d * .7 - .05, r: rnd(.16, .34) * (i < 4 ? 1.4 : 1), ph: rnd(0, 6.28), sp: rnd(.15, .35) });
    }
    neb = [];
    const N = small ? 900 : 1500;
    for (let i = 0; i < N; i++) {
      const L = lobes[i % nL], ox = gauss() * L.r * .45, oy = gauss() * L.r * .38;
      const dist = Math.hypot(L.x + ox, (L.y + oy) * 1.3);
      neb.push({ L, ox, oy, s: rnd(small ? .08 : .06, small ? .26 : .22) * (Math.random() < .06 ? 2.2 : 1), al: rnd(.05, .16), ph: rnd(0, 6.28),
        wh: Math.random() < Math.max(.06, .5 - dist * 1.1) });   // 中心ほど白い
    }
    dust = [];
    for (let i = 0; i < (small ? 500 : 900); i++) {
      const L = lobes[i % nL];
      dust.push({ L, ox: gauss() * L.r * .5, oy: gauss() * L.r * .42, ph: rnd(0, 6.28), sz: Math.random() < .1 ? 2 : 1.1 });
    }
    // 星空(3つの奥行き)
    stars = [];
    for (let i = 0; i < (small ? 220 : 420); i++) {
      const z = Math.random();
      stars.push({ x: rnd(0, W), y: rnd(0, H), z, r: .4 + z * 1.2, ph: rnd(0, 6.28), tw: rnd(.6, 2.4) });
    }
    // 光の糸: 画面を横切る細い線(少し角度がついて、中央に向かって集まる)
    strings = [];
    for (let i = 0; i < (small ? 18 : 30); i++) {
      const left = Math.random() < .5;
      const y0 = rnd(.05, .95) * H, y1 = cy + rnd(-.35, .35) * H;
      strings.push({ x0: left ? -20 : W + 20, y0, x1: left ? W * rnd(.55, 1.1) : W * rnd(-.1, .45), y1,
        al: rnd(.05, .16), glint: Math.random(), gv: rnd(.04, .12) });
    }
    cols = [];
    const nCol = small ? 2 : 4, fs = small ? 10 : 12;
    for (let i = 0; i < nCol; i++) {
      const lft = i % 2 === 0, k = Math.floor(i / 2);
      cols.push({ x: lft ? 6 + k * fs * 1.2 : W - 14 - k * fs * 1.2, y: rnd(0, H), v: rnd(20, 45), fs, chars: randStr(Math.ceil(H / fs) + 4), al: rnd(.08, .18) });
    }
  }
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H * .44; R = Math.min(W, H) * (W < H ? .62 : .48);
    build();
  }

  let last = 0;
  function frame(t) {
    const time = t / 1000, dt = Math.min(.05, last ? time - last : 1 / 60); last = time;
    pulse = Math.max(0, pulse - dt * .45);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * .8);
    bg.addColorStop(0, "#071430"); bg.addColorStop(.5, "#030a1c"); bg.addColorStop(1, "#010309");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // 星空
    for (const s of stars) {
      s.x -= (2 + s.z * 6) * dt; if (s.x < -2) { s.x = W + 2; s.y = rnd(0, H); }
      const a = (.25 + .75 * s.z) * (.55 + .45 * Math.sin(time * s.tw + s.ph));
      ctx.fillStyle = `rgba(${200 + s.z * 55 | 0},${220 + s.z * 35 | 0},255,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }

    // 横の線(奥の壁)
    ctx.lineWidth = 1;
    for (let k = -9; k <= 9; k++) {
      const y = cy + k * H * .045;
      ctx.strokeStyle = `rgba(140,180,255,${.05 + .04 * (1 - Math.abs(k) / 9)})`;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    // 光の糸と、その上を走る光
    for (const s of strings) {
      ctx.strokeStyle = `rgba(190,215,255,${s.al})`;
      ctx.beginPath(); ctx.moveTo(s.x0, s.y0); ctx.lineTo(s.x1, s.y1); ctx.stroke();
      s.glint = (s.glint + s.gv * dt) % 1;
      const gx = s.x0 + (s.x1 - s.x0) * s.glint, gy = s.y0 + (s.y1 - s.y0) * s.glint;
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = .5; ctx.drawImage(white, gx - 5, gy - 5, 10, 10); ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }

    // 数字の列(うっすら)
    ctx.font = `${small ? 10 : 12}px "Share Tech Mono", monospace`; ctx.textAlign = "left";
    for (const c of cols) {
      c.y += c.v * dt; if (c.y > c.fs * 4) { c.y -= c.fs; c.chars = HEX[(Math.random() * 16) | 0] + c.chars.slice(0, -1); }
      for (let i = 0; i < c.chars.length; i++) {
        const y = c.y + (i - 4) * c.fs; if (y < -c.fs || y > H + c.fs) continue;
        ctx.fillStyle = `rgba(90,160,255,${c.al * (1 - i / c.chars.length * .6)})`; ctx.fillText(c.chars[i], c.x, y);
      }
    }

    // 薄い目盛りリング(司令室らしさ)
    ctx.save(); ctx.translate(cx, cy);
    const rr = R * 1.02 * (1 + pulse * .06);
    ctx.rotate(time * .03);
    for (let i = 0; i < 180; i++) {
      const a = i / 180 * 6.283, lg = i % 15 === 0;
      ctx.strokeStyle = `rgba(150,195,255,${lg ? .22 : .08})`;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); ctx.lineTo(Math.cos(a) * (rr - (lg ? 9 : 4)), Math.sin(a) * (rr - (lg ? 9 : 4))); ctx.stroke();
    }
    ctx.rotate(-time * .1);
    ctx.strokeStyle = `rgba(120,175,255,${.16 + pulse * .4})`; ctx.lineWidth = 1.5;
    for (const [a0, a1] of [[.2, 1.3], [2.1, 2.6], [3.4, 4.9], [5.4, 5.9]]) { ctx.beginPath(); ctx.arc(0, 0, R * .9, a0, a1); ctx.stroke(); }
    ctx.lineWidth = 1; ctx.restore();

    // 星雲(加算合成)
    ctx.globalCompositeOperation = "lighter";
    const boost = 1 + pulse * 1.4, dim = linked ? 1 : .85;
    for (const L of lobes) { L.cx = L.x + Math.sin(time * L.sp * .3 + L.ph) * .025; L.cy = L.y + Math.cos(time * L.sp * .25 + L.ph) * .02; }
    for (const p of neb) {
      const L = p.L, sw = Math.sin(time * L.sp + p.ph) * .012;
      const x = cx + (L.cx + p.ox + sw) * R, y = cy + (L.cy + p.oy - sw) * R;
      const s = p.s * R * (1 + pulse * .3);
      ctx.globalAlpha = Math.min(1, p.al * boost * dim * (p.wh ? .7 : 1));
      ctx.drawImage(p.wh ? white : blue, x - s / 2, y - s / 2, s, s);
    }
    // きらきらした細かい粒
    ctx.globalAlpha = 1;
    for (const d of dust) {
      const L = d.L, x = cx + (L.cx + d.ox) * R, y = cy + (L.cy + d.oy) * R;
      const a = .25 + .6 * Math.abs(Math.sin(time * 1.7 + d.ph));
      ctx.fillStyle = `rgba(235,245,255,${a * dim})`; ctx.fillRect(x, y, d.sz, d.sz);
    }
    ctx.globalCompositeOperation = "source-over";

    // 受信時の波紋
    if (pulse > 0) {
      for (let k = 0; k < 3; k++) {
        const tt = (1 - pulse) * 1.4 + k * .18; if (tt > 1) continue;
        ctx.strokeStyle = `rgba(170,210,255,${(1 - tt) * .6})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, R * (.2 + tt * 1.1), 0, 6.283); ctx.stroke();
      }
      ctx.lineWidth = 1;
    }

    // 周辺を暗く
    const vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * .35, cx, cy, Math.max(W, H) * .85);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    if (!reduce) requestAnimationFrame(frame);
  }
  addEventListener("resize", resize);
  resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
